<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>英语练习台 · English Practice Hub</title>
<!-- PWA Manifest & App Icons -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- iOS Web App Support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="英语练习">
<meta name="theme-color" content="#2a78d6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface-1: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --series: #2a78d6;
    --good: #0ca30c;
    --good-text: #006300;
    --warn: #fab219;
    --serious: #ec835a;
    --hm-0: #e1e0d9; --hm-1: #9ec5f4; --hm-2: #5598e7; --hm-3: #256abf; --hm-4: #184f95;
    --accent-wash: rgba(42,120,214,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface-1: #1a1a19;
      --ink: #f0efec;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --series: #3987e5;
      --good: #0ca30c;
      --good-text: #0ca30c;
      --warn: #fab219;
      --serious: #ec835a;
      --hm-0: #2c2c2a; --hm-1: #184f95; --hm-2: #256abf; --hm-3: #3987e5; --hm-4: #86b6ef;
      --accent-wash: rgba(57,135,229,0.12);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--page); color: var(--ink); font-size: 15px; line-height: 1.6;
    padding-bottom: 60px;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 20px; }

  /* ---- header & tabs ---- */
  header { border-bottom: 1px solid var(--grid); background: var(--surface-1); }
  .head-row { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 0 10px; flex-wrap: wrap; gap: 6px; }
  h1 { font-size: 20px; font-weight: 700; }
  .updated { font-size: 12px; color: var(--muted); }
  nav { display: flex; gap: 4px; padding-bottom: 0; overflow-x: auto; }
  nav button {
    appearance: none; border: none; background: none; cursor: pointer;
    font: inherit; font-size: 14px; color: var(--ink-2);
    padding: 10px 14px; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  nav button:hover { color: var(--ink); background: var(--accent-wash); }
  nav button.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--series); }

  section.tab { display: none; padding-top: 20px; }
  section.tab.on { display: block; }

  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px 20px; margin-bottom: 16px;
  }
  h2 { font-size: 16px; font-weight: 650; margin-bottom: 12px; }
  h3 { font-size: 14px; font-weight: 600; color: var(--ink-2); margin: 14px 0 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  .en { font-variant-numeric: tabular-nums; }

  /* ---- today ---- */
  .pack-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .pack-title { font-size: 17px; font-weight: 650; }
  .type-badge {
    display: inline-block; font-size: 12px; font-weight: 600; color: var(--ink);
    background: var(--accent-wash); border-radius: 999px; padding: 2px 10px; margin-left: 8px;
  }
  .date-nav { display: flex; gap: 6px; }
  .date-nav button {
    appearance: none; border: 1px solid var(--border); background: var(--surface-1); color: var(--ink-2);
    border-radius: 8px; padding: 5px 12px; cursor: pointer; font: inherit; font-size: 13px;
  }
  .date-nav button:hover:not(:disabled) { border-color: var(--series); color: var(--ink); }
  .date-nav button:disabled { opacity: .35; cursor: default; }
  .q-progress { font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .q-progress .bar { height: 4px; background: var(--grid); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .q-progress .bar i { display: block; height: 100%; background: var(--series); border-radius: 2px; transition: width .3s; }
  .prompt { font-size: 16px; margin: 14px 0; line-height: 1.7; }
  textarea {
    width: 100%; min-height: 84px; resize: vertical;
    font: inherit; font-size: 14px; line-height: 1.6;
    background: var(--page); color: var(--ink);
    border: 1px solid var(--grid); border-radius: 8px; padding: 10px 12px;
  }
  textarea:focus { outline: 2px solid var(--series); outline-offset: -1px; }
  .btn {
    appearance: none; cursor: pointer; font: inherit; font-size: 14px; font-weight: 600;
    background: var(--series); color: #fff; border: none; border-radius: 8px; padding: 9px 20px;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: none; color: var(--ink-2); border: 1px solid var(--border); font-weight: 500; }
  .btn.ghost:hover { border-color: var(--series); color: var(--ink); }
  .answer { border-left: 3px solid var(--series); background: var(--accent-wash); border-radius: 0 8px 8px 0; padding: 12px 14px; margin: 14px 0; }
  .answer .a-label { font-size: 12px; font-weight: 700; color: var(--series); letter-spacing: .05em; }
  .answer .a-text { font-size: 15px; margin: 4px 0 6px; }
  .answer ul { margin: 6px 0 0 18px; }
  .answer li { font-size: 13px; color: var(--ink-2); }
  .grade-row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .grade-btn {
    appearance: none; cursor: pointer; font: inherit; font-size: 14px; font-weight: 600;
    border-radius: 8px; padding: 8px 18px; border: 1px solid var(--border); background: var(--surface-1); color: var(--ink-2);
  }
  .grade-btn[data-g="ok"]:hover { border-color: var(--good); color: var(--good-text); }
  .grade-btn[data-g="half"]:hover { border-color: var(--warn); color: var(--ink); }
  .grade-btn[data-g="bad"]:hover { border-color: var(--serious); color: var(--serious); }
  .grade-btn.picked { border-width: 2px; padding: 7px 17px; }
  .grade-btn.picked[data-g="ok"] { border-color: var(--good); color: var(--good-text); }
  .grade-btn.picked[data-g="half"] { border-color: var(--warn); color: var(--ink); }
  .grade-btn.picked[data-g="bad"] { border-color: var(--serious); color: var(--serious); }
  .done-summary { text-align: center; padding: 10px 0; }
  .done-summary .big { font-size: 22px; font-weight: 700; margin: 6px 0; }
  .done-chips { display: flex; justify-content: center; gap: 14px; font-size: 14px; color: var(--ink-2); margin: 8px 0 16px; }
  .done-chips b { font-variant-numeric: tabular-nums; }
  .grade-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align: 1px; }

  /* ---- stat tiles ---- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile .v { font-size: 26px; font-weight: 700; line-height: 1.2; }
  .tile .k { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ---- charts ---- */
  .chart-title { font-size: 14px; font-weight: 650; margin: 4px 0 10px; }
  .hbar-row { display: grid; grid-template-columns: 76px 1fr 34px; align-items: center; gap: 10px; margin-bottom: 8px; }
  .hbar-label { font-size: 13px; color: var(--ink-2); text-align: right; }
  .hbar-track { height: 18px; }
  .hbar-fill { height: 100%; background: var(--series); border-radius: 0 4px 4px 0; min-width: 2px; }
  .hbar-val { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hm-months { display: flex; font-size: 11px; color: var(--muted); margin-left: 30px; margin-bottom: 3px; }
  .hm-grid { display: flex; gap: 3px; }
  .hm-days { display: flex; flex-direction: column; gap: 3px; font-size: 10px; color: var(--muted); width: 26px; justify-content: space-between; padding-top: 0; }
  .hm-days span { height: 13px; line-height: 13px; }
  .hm-col { display: flex; flex-direction: column; gap: 3px; }
  .hm-cell { width: 13px; height: 13px; border-radius: 3px; }
  .hm-legend { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); margin-top: 8px; margin-left: 30px; }
  .hm-legend .hm-cell { width: 11px; height: 11px; }
  svg text { font-family: inherit; }

  /* ---- error bank ---- */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip {
    appearance: none; cursor: pointer; font: inherit; font-size: 13px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--ink-2);
    border-radius: 999px; padding: 4px 14px;
  }
  .chip.on { background: var(--accent-wash); border-color: var(--series); color: var(--ink); font-weight: 600; }
  select {
    font: inherit; font-size: 13px; color: var(--ink-2);
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px;
  }
  .err-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; background: var(--surface-1); }
  .err-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .badge { font-size: 11px; font-weight: 600; border-radius: 5px; padding: 1px 8px; border: 1px solid var(--border); color: var(--ink-2); }
  .badge.status { display: inline-flex; align-items: center; gap: 5px; }
  .badge.status i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .err-wrong { color: var(--muted); text-decoration: line-through; font-size: 14px; }
  .err-right { font-size: 15px; font-weight: 600; margin: 3px 0 6px; }
  .err-note { font-size: 13px; color: var(--ink-2); }
  .err-meta { font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* ---- notes / recite ---- */
  details.note-group { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; background: var(--surface-1); }
  details.note-group summary { cursor: pointer; padding: 12px 16px; font-weight: 600; font-size: 14px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  details.note-group summary::-webkit-details-marker { display: none; }
  details.note-group summary .count { font-size: 12px; color: var(--muted); font-weight: 400; }
  details.note-group .body { padding: 0 16px 14px; }
  .note-item { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 7px 0; border-top: 1px solid var(--grid); font-size: 14px; }
  .note-item .zh { color: var(--ink-2); }
  .recite-item { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-top: 1px solid var(--grid); }
  .recite-item:first-of-type { border-top: none; }
  .recite-item input[type=checkbox] { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--series); cursor: pointer; }
  .recite-pair .wrong { color: var(--muted); text-decoration: line-through; font-size: 13px; }
  .recite-pair .right { font-size: 14.5px; font-weight: 600; }
  .recite-pair.done .right { color: var(--good-text); }
  .group-progress { font-size: 12px; color: var(--muted); }

  #tooltip {
    position: fixed; display: none; pointer-events: none; z-index: 50;
    background: var(--ink); color: var(--page); font-size: 12px; line-height: 1.5;
    border-radius: 6px; padding: 6px 10px; max-width: 240px;
  }
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty .btn { margin-top: 14px; }

  /* Modal overlay & card */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
  }
  .modal-card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    max-width: 440px; width: 100%; padding: 22px; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  @media (max-width: 560px) { .note-item { grid-template-columns: 1fr; gap: 2px; } }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="head-row">
      <h1>英语练习台</h1>
      <span class="muted">数据更新于 <span id="updatedAt"></span> · 与 Claude 练习后自动同步</span>
    </div>
    <nav id="tabs">
      <button data-tab="today" class="on">今日练习</button>
      <button data-tab="errors">错题本</button>
      <button data-tab="notes">笔记库</button>
      <button data-tab="recite">必背句</button>
      <button data-tab="stats">统计打卡</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <section class="tab on" id="tab-today"></section>
  <section class="tab" id="tab-errors"></section>
  <section class="tab" id="tab-notes"></section>
  <section class="tab" id="tab-recite"></section>
  <section class="tab" id="tab-stats"></section>
</div>

<div id="tooltip"></div>

<div id="tokenModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <div style="font-weight:650; font-size:16px; margin-bottom:8px;">⚙️ 配置 GitHub 自动推送</div>
    <div style="font-size:13px; color:var(--ink-2); line-height:1.5; margin-bottom:12px;">
      输入你的 GitHub Personal Access Token (PAT，仅勾选 <b>issues:write</b> 权限)。<br>
      设置后，每次练习完成即可自动将答题记录与自评推送至仓库 Issues 留存，方便随时查看与分析！
    </div>
    <input type="password" id="ghTokenInput" placeholder="粘贴 ghp_ 开头的 Token" style="width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:8px; font-family:monospace; margin-bottom:12px; background:var(--surface-1); color:var(--ink);">
    <div style="display:flex; gap:8px; justify-content:flex-end;">
      <button class="btn ghost" id="closeTokenModal">取消</button>
      <button class="btn" id="saveTokenBtn">保存并立即推送</button>
    </div>
  </div>
</div>

<script src="data.js?v=2026-10-29-recall"></script><!-- ?v= 版本号随 data.js 更新同步修改，用于绕过浏览器缓存 -->
<script>
(function () {
  "use strict";
  const D = PRACTICE_DATA;
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const todayStr = () => {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  };
  const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

  /* ---------- storage ---------- */
  const store = {
    get(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
      catch { return fallback; }
    },
    set(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
  };
  let progress = store.get("ep_progress", {});     // {packDate: {answers:[], grades:[], doneAt}}
  let activity = store.get("ep_activity", {});     // {dateStr: count}
  let reciteDone = store.get("ep_recite", {});     // {"group|i": true}

  const saveAll = () => { store.set("ep_progress", progress); store.set("ep_activity", activity); store.set("ep_recite", reciteDone); };
  const bumpActivity = () => { const t = todayStr(); activity[t] = (activity[t] || 0) + 1; store.set("ep_activity", activity); };

  /* ---------- tooltip ---------- */
  const tip = $("#tooltip");
  const showTip = (ev, html) => {
    tip.innerHTML = html; tip.style.display = "block";
    const x = Math.min(ev.clientX + 12, window.innerWidth - 250);
    tip.style.left = x + "px"; tip.style.top = (ev.clientY + 14) + "px";
  };
  const hideTip = () => { tip.style.display = "none"; };
  const bindTip = (el, html) => {
    el.addEventListener("mousemove", ev => showTip(ev, html));
    el.addEventListener("mouseleave", hideTip);
  };

  /* ---------- tabs ---------- */
  $("#tabs").addEventListener("click", e => {
    const btn = e.target.closest("button"); if (!btn) return;
    $$("nav button").forEach(b => b.classList.toggle("on", b === btn));
    $$("section.tab").forEach(s => s.classList.toggle("on", s.id === "tab-" + btn.dataset.tab));
  });

  /* ================= TODAY ================= */
  const packs = D.packs.slice().sort((a, b) => a.date < b.date ? -1 : 1);
  let packIdx = Math.max(0, packs.findIndex(p => p.date === todayStr()));
  if (packIdx < 0) packIdx = packs.length - 1; // 无今日题包 → 显示最近一期
  let qi = 0, revealed = false;

  // 额外练习模式状态
  let extraMode = false;
  let extraItems = [];
  let extraQi = 0;
  let extraGrades = [];
  let extraAnswers = [];
  let extraRevealed = false;

  function initExtraMode() {
    extraMode = true;
    extraQi = 0;
    extraGrades = [];
    extraAnswers = [];
    extraRevealed = false;
    const pool = [];
    (D.errorBank || []).filter(e => e.status !== "graduated").forEach(e => {
      pool.push({
        type: "错题强化",
        q: `<b>【错题强化】</b> 改错或地道表达翻译：<br>❌ 错误/不地道：<span style="color:var(--serious)">${e.wrong}</span>`,
        a: `⭐ 地道表达：${e.right}`,
        notes: [e.note]
      });
    });
    (D.notes || []).forEach(group => {
      group.items.forEach(it => {
        pool.push({
          type: "场景地道表达",
          q: `<b>【场景表达】</b> (${group.scene})<br>中文意图：${it.zh}`,
          a: `⭐ 地道表达：${it.en}`,
          notes: [group.scene]
        });
      });
    });
    pool.sort(() => Math.random() - 0.5);
    extraItems = pool.slice(0, 5);
  }

  function copyReport(p, rec) {
    const ok = rec.grades.filter(g => g === "ok").length;
    const half = rec.grades.filter(g => g === "half").length;
    const bad = rec.grades.filter(g => g === "bad").length;
    const md = `## 📝 英语练习打卡记录 · ${p.date} (${p.weekday})
- **练习类型**: ${p.type}
- **完成题数**: ${p.items.length} 题
- **成绩统计**: 全对 ${ok} | 半对 ${half} | 有错 ${bad}

${p.items.map((it, i) => `#### 第 ${i + 1} 题 · ${rec.grades[i] === 'ok' ? '✅ 全对' : rec.grades[i] === 'half' ? '⚠️ 半对' : '❌ 有错'}
- **题目**: ${it.q.replace(/<[^>]+>/g, '')}
- **我的作答**: ${rec.answers[i] || '（未输入）'}
- **参考答案**: ${it.a}
${it.notes && it.notes.length ? `- **要点**: ${it.notes.join('; ')}` : ''}`).join('\n\n')}`;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(md).then(() => {
        alert("✅ 练习报告已成功复制到剪贴板！可以直接粘贴发给 Claude。");
      });
    } else {
      const ta = document.createElement("textarea");
      ta.value = md; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta);
      alert("✅ 练习报告已成功复制！");
    }
  }

  async function syncToGitHub(p, rec) {
    let token = localStorage.getItem("ep_github_token");
    if (!token) {
      $("#tokenModal").style.display = "flex";
      $("#ghTokenInput").focus();
      return;
    }
    const statusEl = $("#syncStatus");
    if (statusEl) statusEl.textContent = "⏳ 正在推送至 GitHub Issues...";

    const ok = rec.grades.filter(g => g === "ok").length;
    const half = rec.grades.filter(g => g === "half").length;
    const bad = rec.grades.filter(g => g === "bad").length;

    const markdownBody = `## 📝 英语练习打卡记录 · ${p.date} (${p.weekday})

- **练习类型**: ${p.type}
- **完成题数**: ${p.items.length} 题
- **成绩统计**: 全对 ${ok} | 半对 ${half} | 有错 ${bad}
- **提交时间**: ${new Date().toLocaleString('zh-CN')}

---

### 答题与总结详情

${p.items.map((it, i) => `#### 第 ${i + 1} 题 · ${rec.grades[i] === 'ok' ? '✅ 全对' : rec.grades[i] === 'half' ? '⚠️ 半对' : '❌ 有错'}
- **题目**: ${it.q.replace(/<[^>]+>/g, '')}
- **我的作答**: ${rec.answers[i] || '（未输入）'}
- **参考答案**: ${it.a}
${it.notes && it.notes.length ? `- **要点**: ${it.notes.join('; ')}` : ''}`).join('\n\n')}`;

    try {

  function analyzeAnswer(userAns, stdAns, notes) {
    if (!userAns || !userAns.trim()) {
      return {
        recommend: "bad",
        matchPercent: 0,
        feedbackHtml: '<div style="font-size:12.5px; color:var(--serious); margin-top:8px;">⚠️ 未填写作答，建议对照参考答案复习。</div>'
      };
    }

    const normUser = userAns.toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
    const normStd = stdAns.toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();

    // 1. 提取核心考点短语
    const targetPhrases = [];
    if (notes && notes.length) {
      notes.forEach(n => {
        const match = n.match(/([a-zA-Z\s'\-]{3,})/);
        if (match && match[1]) {
          const p = match[1].trim().toLowerCase();
          if (p.length >= 3 && !["and", "the", "for", "you", "not", "with", "this"].includes(p)) {
            targetPhrases.push(p);
          }
        }
      });
    }

    // 2. 检测核心考点命中情况
    const hits = [];
    const misses = [];
    targetPhrases.forEach(tp => {
      if (normUser.includes(tp)) hits.push(tp);
      else misses.push(tp);
    });

    // 3. 单词与结构重合率
    const userWords = normUser.split(" ");
    const stdWords = normStd.split(" ");
    const userWordSet = new Set(userWords.filter(w => w.length > 1));
    let matchedCount = 0;
    const stdMeaningfulWords = stdWords.filter(w => w.length > 1);
    stdMeaningfulWords.forEach(w => { if (userWordSet.has(w)) matchedCount++; });
    const similarity = stdMeaningfulWords.length > 0 ? Math.round((matchedCount / stdMeaningfulWords.length) * 100) : 0;

    // 4. 非核心考点 / 语法细节分析（介词、单复数、助动词、时态）
    const detailDiffs = [];

    // 介词检测
    const prepList = ["at", "on", "in", "for", "to", "off", "with", "from", "into", "between"];
    prepList.forEach(prep => {
      if (normStd.includes(" " + prep + " ") && !normUser.includes(" " + prep + " ")) {
        detailDiffs.push(`介词/短语词 <b>"${prep}"</b> (标准答案包含，你的作答未检测到)`);
      }
    });

    // 常见单复数/动词形式检测 (以 's' 结尾的关键词)
    stdWords.forEach(w => {
      if (w.length >= 4 && w.endsWith("s") && !userWordSet.has(w) && userWordSet.has(w.slice(0, -1))) {
        detailDiffs.push(`复数/三单形式 <b>"${w}"</b> (你的回答可能写成了单数/原形 "${w.slice(0, -1)}")`);
      }
    });

    // 5. 综合推荐逻辑（非核心细节有错时降级）
    let recGrade = "bad";
    const hasDetailIssues = detailDiffs.length > 0;

    if (similarity >= 85 && misses.length === 0 && !hasDetailIssues) {
      recGrade = "ok";
    } else if (similarity >= 60 || hits.length > 0) {
      recGrade = "half"; // 只要有细节出入或部分缺失，推荐【半对】以加深细节记忆
    }

    // 6. 生成分析反馈 HTML
    let feedbackContent = "";
    if (hits.length > 0) {
      feedbackContent += `<div style="font-size:12.5px; color:var(--good-text); margin-top:4px;">🎯 核心考点命中: <b>${hits.join(", ")}</b> ✅</div>`;
    }
    if (misses.length > 0) {
      feedbackContent += `<div style="font-size:12.5px; color:var(--serious); margin-top:4px;">💡 建议包含的核心表达: <b>${misses.join(", ")}</b></div>`;
    }
    if (detailDiffs.length > 0) {
      feedbackContent += `<div style="font-size:12px; color:var(--ink-2); margin-top:6px; border-top:1px dashed var(--grid); padding-top:6px;">
        🔍 <b>非核心语法与细节差异</b>：
        <ul style="margin:2px 0 0 16px; padding:0; line-height:1.4;">
          ${detailDiffs.slice(0, 3).map(d => `<li>${d}</li>`).join("")}
        </ul>
      </div>`;
    }

    const gradeLabel = recGrade === "ok" ? "✅ 推荐评价：全对" : recGrade === "half" ? "⚠️ 推荐评价：半对 (注意细节)" : "❌ 推荐评价：有错";
    const gradeColor = recGrade === "ok" ? "var(--good-text)" : recGrade === "half" ? "var(--warn)" : "var(--serious)";

    const feedbackHtml = `
      <div style="background:var(--page); border:1px solid var(--border); border-radius:8px; padding:8px 12px; margin-top:10px;">
        <div style="display:flex; justify-content:space-between; align-items:center; font-size:12.5px; font-weight:600;">
          <span>🤖 智能对比分析</span>
          <span style="color:${gradeColor};">${gradeLabel} (匹配度 ${similarity}%)</span>
        </div>
        ${feedbackContent}
      </div>`;

    return { recommend: recGrade, matchPercent: similarity, feedbackHtml };
  }

  function renderAnswer(p, it, i) {
    const zone = $("#answerZone"); if (!zone) return;
    const rec = progress[p.date] || { answers: [], grades: [] };
    const userAns = (rec.answers || [])[i] || "";
    const analysis = analyzeAnswer(userAns, it.a, it.notes);

    // 如果未选评价，默认应用推荐评价
    if (!rec.grades[i]) {
      progress[p.date] = progress[p.date] || { answers: [], grades: [] };
      progress[p.date].grades[i] = analysis.recommend;
      bumpActivity();
      store.set("ep_progress", progress);
    }
    const currentGrade = progress[p.date].grades[i];

    zone.innerHTML = `
      <div class="answer">
        <div class="a-label">参考答案</div>
        <div class="a-text">${it.a}</div>
        ${it.notes && it.notes.length ? "<ul>" + it.notes.map(n => `<li>${n}</li>`).join("") + "</ul>" : ""}

      </div>
      <div class="grade-row">
        <button class="grade-btn ${currentGrade === "ok" ? "picked" : ""}" data-g="ok">✅ 全对</button>
        <button class="grade-btn ${currentGrade === "half" ? "picked" : ""}" data-g="half">⚠️ 半对</button>
        <button class="grade-btn ${currentGrade === "bad" ? "picked" : ""}" data-g="bad">❌ 有错</button>
        <button class="btn" id="nextQ" style="margin-left:auto">${i + 1 < p.items.length ? "下一题 →" : "完成本期 🎉"}</button>
      </div>`;
    $$(".grade-btn", zone).forEach(btn => {
      btn.onclick = () => {
        progress[p.date] = progress[p.date] || { answers: [], grades: [] };

        store.set("ep_progress", progress);
        $$(".grade-btn", zone).forEach(b => b.classList.toggle("picked", b === btn));

    });

      revealed = false;
      if (i + 1 < p.items.length) { qi = i + 1; renderToday(); }
      else { renderToday(); }
    };
  }

  /* ================= ERRORS ================= */
  let errStatus = "all", errCat = "all";
  function renderErrors() {
    const el = $("#tab-errors");
    const all = D.errorBank;
    const active = all.filter(e => e.status === "active");
    const watching = all.filter(e => e.status === "watching");
    const grad = all.filter(e => e.status === "graduated");
    const rate = all.length ? Math.round(grad.length / all.length * 100) : 0;

    // 分类统计
    const catCount = {};
    all.forEach(e => { catCount[e.category] = (catCount[e.category] || 0) + e.wrongCount; });
    const cats = Object.entries(catCount).sort((a, b) => b[1] - a[1]);
    const maxC = cats.length ? cats[0][1] : 1;

    const catsOpts = ["all"].concat(Object.keys(catCount));
    el.innerHTML = `
      <div class="tiles">
        <div class="tile"><div class="v en">${all.length}</div><div class="k">累计错题模式</div></div>
        <div class="tile"><div class="v en">${active.length}</div><div class="k">活跃（重点攻克）</div></div>
        <div class="tile"><div class="v en">${watching.length}</div><div class="k">观察中</div></div>
        <div class="tile"><div class="v en">${grad.length}<span class="muted" style="font-size:15px"> / ${all.length}</span></div><div class="k">已毕业（${rate}%）</div></div>
      </div>
      <div class="card">
        <div class="chart-title">错误分类占比（按累计出错次数）</div>
        ${cats.map(([c, n]) => `
          <div class="hbar-row">
            <div class="hbar-label">${c}</div>
            <div class="hbar-track"><div class="hbar-fill" data-cat="${c}" style="width:${n / maxC * 100}%"></div></div>
            <div class="hbar-val">${n} 次</div>
          </div>`).join("")}
      </div>
      <div class="card">
        <div class="filters">
          ${[["all", "全部"], ["active", "活跃"], ["watching", "观察中"], ["graduated", "已毕业"]].map(([v, l]) =>
            `<button class="chip ${errStatus === v ? "on" : ""}" data-st="${v}">${l}</button>`).join("")}
          <select id="catSel">${catsOpts.map(c => `<option value="${c}" ${errCat === c ? "selected" : ""}>${c === "all" ? "全部分类" : c}</option>`).join("")}</select>
        </div>
        <div id="errList"></div>
      </div>`;
    $$(".chip", el).forEach(ch => ch.onclick = () => { errStatus = ch.dataset.st; renderErrors(); });
    $("#catSel").onchange = e => { errCat = e.target.value; renderErrors(); };

    const statusMeta = {
      active: { label: "活跃", color: "var(--serious)" },
      watching: { label: "观察中", color: "var(--warn)" },
      graduated: { label: "已毕业", color: "var(--good)" }
    };
    const list = all.filter(e =>
      (errStatus === "all" || e.status === errStatus) && (errCat === "all" || e.category === errCat)
    ).sort((a, b) => {
      const rank = { active: 0, watching: 1, graduated: 2 };
      return rank[a.status] - rank[b.status] || b.wrongCount - a.wrongCount;
    });
    const listEl = $("#errList");
    if (!list.length) { listEl.innerHTML = '<div class="empty" style="padding:20px">这个筛选下没有错题</div>'; return; }
    list.forEach(e => {
      const sm = statusMeta[e.status];
      const card = document.createElement("div");
      card.className = "err-card";
      card.innerHTML = `
        <div class="err-top">
          <span class="badge">${e.category}</span>
          <span class="badge status"><i style="background:${sm.color}"></i>${sm.label}</span>
        </div>
        <div class="err-wrong">${e.wrong}</div>
        <div class="err-right">⭐ ${e.right}</div>
        <div class="err-note">${e.note}</div>
        <div class="err-meta">累计出错 ${e.wrongCount} 次 · 最近一次 ${e.lastWrong}${e.graduatedOn ? " · 毕业于 " + e.graduatedOn : ""}</div>`;
      listEl.appendChild(card);
    });
  }

        <div class="card">
          <h2 style="margin-bottom:4px">${g.group}</h2>
          <div class="group-progress en">${done} / ${g.items.length} 已脱口而出</div>
          <div style="margin-top:8px">
          ${g.items.map((it, ii) => {
            const key = gi + "|" + ii;
            const on = !!reciteDone[key];
            return `
            <label class="recite-item">
              <input type="checkbox" data-key="${key}" ${on ? "checked" : ""}>
              <div class="recite-pair ${on ? "done" : ""}">
                <div class="wrong">❌ ${it.wrong}</div>
                <div class="right">⭐ ${it.right}</div>
              </div>
            </label>`;
          }).join("")}
          </div>
        </div>`;
      }).join("");
    $$('input[type=checkbox]', el).forEach(cb => {
      cb.onchange = () => {
        reciteDone[cb.dataset.key] = cb.checked || undefined;
        saveAll(); renderRecite();
      };
    });
  }

  /* ================= STATS ================= */
  function renderStats() {
    const el = $("#tab-stats");

    // 连续打卡
    let streak = 0;
    { const d = new Date();
      if (!activity[iso(d)]) d.setDate(d.getDate() - 1); // 今天还没练不打断连击
      while (activity[iso(d)]) { streak++; d.setDate(d.getDate() - 1); }
    }
    const totalQ = Object.values(activity).reduce((a, b) => a + b, 0);
    const activeDays = Object.keys(activity).length;

    // 热力图：最近 16 周
    const weeks = 16, cell = 13, gap = 3;
    const dayNames = ["一", "", "二", "", "三", "", "四", "", "五", "", "六", "", "日"];
    const end = new Date(); end.setHours(0, 0, 0, 0);
    const dow = (end.getDay() + 6) % 7; // 周一=0
    const thisMonday = new Date(end); thisMonday.setDate(end.getDate() - dow);
    const startMonday = new Date(thisMonday); startMonday.setDate(thisMonday.getDate() - (weeks - 1) * 7);
    const hmLevels = [0, 1, 2, 3, 4];
    const lvColor = n => n <= 0 ? "var(--hm-0)" : n === 1 ? "var(--hm-1)" : n === 2 ? "var(--hm-2)" : n === 3 ? "var(--hm-3)" : "var(--hm-4)";
    let hmCells = "", monthMarks = [];
    let curMonth = -1;
    for (let w = 0; w < weeks; w++) {
      let col = "";
      for (let d = 0; d < 7; d++) {
        const date = new Date(startMonday); date.setDate(startMonday.getDate() + w * 7 + d);
        const s = iso(date);
        if (date > end) { col += `<div class="hm-cell" style="background:transparent"></div>`; continue; }
        const n = activity[s] || 0;
        const dd = date.getDate();
        if (d === 0 && date.getMonth() !== curMonth && dd <= 14) {
          curMonth = date.getMonth();
          monthMarks.push({ w, label: (date.getMonth() + 1) + "月" });
        }
        col += `<div class="hm-cell" data-d="${s}" data-n="${n}" style="background:${lvColor(n)}"></div>`;
      }
      hmCells += `<div class="hm-col">${col}</div>`;
    }
    let monthsHtml = "";
    let lastW = -1;
    monthMarks.forEach(m => { monthsHtml += `<span style="margin-left:${(m.w - lastW - 1) * (cell + gap)}px">${m.label}</span>`; lastW = m.w; });

    // 每周答题数（最近 8 周）
    const wk = 8, w = 90, bw = 34, bh = 110;
    const wkData = [];
    for (let i = wk - 1; i >= 0; i--) {
      const mon = new Date(thisMonday); mon.setDate(thisMonday.getDate() - i * 7);
      const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
      let n = 0;
      for (let d = new Date(mon); d <= sun; d.setDate(d.getDate() + 1)) n += activity[iso(d)] || 0;
      wkData.push({ label: (mon.getMonth() + 1) + "/" + mon.getDate(), n });
    }
    const maxN = Math.max(1, ...wkData.map(x => x.n));
    let barsSvg = `<svg viewBox="0 0 ${wk * bw + 20} ${bh + 34}" style="width:100%;max-width:460px">`;
    barsSvg += `<line x1="10" y1="${bh + 6}" x2="${wk * bw + 10}" y2="${bh + 6}" stroke="var(--baseline)" stroke-width="1"/>`;
    wkData.forEach((d, i) => {
      const h = d.n / maxN * (bh - 20);
      const x = 10 + i * bw + (bw - 20) / 2;
      const y = bh + 6 - 4 - h;
      barsSvg += `<rect x="${x}" y="${y}" width="20" height="${Math.max(h, 2)}" rx="3" fill="var(--series)" data-wk="${d.label}" data-n="${d.n}"><title>${d.label} 那周 · ${d.n} 题</title></rect>`;
      if (d.n > 0) barsSvg += `<text x="${x + 10}" y="${y - 6}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${d.n}</text>`;
      barsSvg += `<text x="${x + 10}" y="${bh + 22}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.label}</text>`;
    });
    barsSvg += "</svg>";

    el.innerHTML = `
      <div class="tiles">
        <div class="tile"><div class="v en">${streak}</div><div class="k">连续打卡（天）</div></div>
        <div class="tile"><div class="v en">${activeDays}</div><div class="k">累计练习天数</div></div>
        <div class="tile"><div class="v en">${totalQ}</div><div class="k">累计答题数</div></div>
      </div>
      <div class="card">
        <div class="chart-title">练习热力图（近 16 周，颜色越深当天练得越多）</div>
        <div class="hm-months">${monthsHtml}</div>
        <div class="hm-grid">
          <div class="hm-days">${dayNames.map(n => `<span>${n}</span>`).join("")}</div>
          ${hmCells}
        </div>
        <div class="hm-legend">少 <span class="hm-cell" style="background:var(--hm-0)"></span><span class="hm-cell" style="background:var(--hm-1)"></span><span class="hm-cell" style="background:var(--hm-2)"></span><span class="hm-cell" style="background:var(--hm-3)"></span><span class="hm-cell" style="background:var(--hm-4)"></span> 多</div>
      </div>
      <div class="card">
        <div class="chart-title">每周答题数（近 8 周）</div>
        ${barsSvg}
      </div>`;
    $$(".hm-cell[data-d]", el).forEach(c => {
      const n = +c.dataset.n;
      const d = c.dataset.d;
      bindTip(c, n > 0 ? `${d} · 练了 ${n} 题` : `${d} · 休息`);
    });
  }

  /* ---------- init ---------- */
  $("#updatedAt").textContent = D.updatedAt;
  renderToday(); renderErrors(); renderNotes(); renderRecite(); renderStats();
})();

// PWA Service Worker 注册
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('SW Registered:', reg.scope))
      .catch(err => console.error('SW Register failed:', err));
  });
}
</script>
</body>
